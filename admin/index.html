<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>yapp admin</title>
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
</head>
<body>
<main id="app">
  <section id="login" class="card narrow" hidden>
    <h1>yapp admin</h1>
    <form id="emailForm">
      <input id="email" type="email" placeholder="email" autocomplete="email" required>
      <button>send code</button>
    </form>
    <form id="codeForm" hidden>
      <input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
      <button>sign in</button>
    </form>
    <p id="loginErr" class="err"></p>
  </section>

  <section id="dash" hidden>
    <header>
      <h1>yapp admin</h1>
      <button id="signOut" class="ghost">sign out</button>
    </header>
    <div id="stats" class="stats"></div>
    <nav id="tabs">
      <button data-tab="open" class="on">open reports</button>
      <button data-tab="actioned">actioned</button>
      <button data-tab="dismissed">dismissed</button>
      <button data-tab="users">users</button>
      <button data-tab="bans">bans</button>
    </nav>
    <div id="search" hidden><input id="q" placeholder="search username, name or email"></div>
    <div id="list" class="list"></div>
  </section>
</main>
</body>
</html>

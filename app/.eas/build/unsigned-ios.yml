build:
  name: Unsigned iOS IPA
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/prebuild
    - run:
        name: Install pods
        working_directory: ./ios
        command: pod install
    - run:
        name: Build unsigned app
        working_directory: ./ios
        command: |
          set -eo pipefail
          xcodebuild -workspace Yapp.xcworkspace -scheme Yapp -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "built app: $APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry /Users/expo/workingdir/build/yapp-unsigned.ipa Payload
          ls -la /Users/expo/workingdir/build/yapp-unsigned.ipa
    - eas/upload_artifact:
        name: Upload IPA
        inputs:
          path: /Users/expo/workingdir/build/yapp-unsigned.ipa
